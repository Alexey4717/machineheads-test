name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Prettier
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: /api

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build with testids
        run: pnpm build
        env:
          E2E: '1'
          VITE_API_BASE_URL: /api

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: /api
      VERCEL_CLI: vercel@58.9.4
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Normalize Vercel secrets
        env:
          RAW_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          RAW_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n"'\''[:space:]'; }
          ORG_ID="$(trim "$RAW_ORG_ID")"
          PROJECT_ID="$(trim "$RAW_PROJECT_ID")"
          TOKEN="$(trim "$RAW_TOKEN")"

          if [ -z "$ORG_ID" ] || [ -z "$PROJECT_ID" ] || [ -z "$TOKEN" ]; then
            echo "One or more Vercel secrets are empty"
            exit 1
          fi

          echo "ORG_ID prefix=${ORG_ID:0:5} len=${#ORG_ID}"
          echo "PROJECT_ID prefix=${PROJECT_ID:0:4} len=${#PROJECT_ID}"
          echo "TOKEN len=${#TOKEN}"

          {
            echo "VERCEL_ORG_ID=$ORG_ID"
            echo "VERCEL_PROJECT_ID=$PROJECT_ID"
            echo "VERCEL_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

      - name: Verify Vercel project access
        run: |
          CODE=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          echo "HTTP $CODE"
          head -c 300 /tmp/vercel-project.json; echo
          test "$CODE" = "200"

      - name: Build app
        run: pnpm build

      - name: Prepare Vercel Build Output API
        run: |
          mkdir -p .vercel/output/static
          cp -R build/. .vercel/output/static/
          printf '%s\n' '{"orgId":"'"$VERCEL_ORG_ID"'","projectId":"'"$VERCEL_PROJECT_ID"'"}' > .vercel/project.json
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          echo "Linked project:" && cat .vercel/project.json
          echo "CLI via npx:" && npx --yes "$VERCEL_CLI" --version

      - name: Deploy to Vercel
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
